packages:
  - 'packages/*'
  - 'crates/koyori-arc-core/pkg' # wasm-pack 出力。build-npm.sh 実行後に有効
allowBuilds:
  esbuild: true

# --- pnpm 12.4 orchestrator 試行 ---
includeWorkspaceRoot: true
pipelineBase: master
cargo:
  enabled: true
tasks:
  nextest:
  wasmtest:
    dependsOn: [nextest]
  npmbuild:
    dependsOn: [nextest, wasmtest]
    outputs:
      - crates/koyori-arc-core/pkg/**
  typecheck:
    dependsOn: [npmbuild]
  build:
    dependsOn: [typecheck]
    outputs:
      - dist/**
  test:
    dependsOn: [build]
pipelines:
  default:
    - nextest
    - wasmtest
    - npmbuild
    - typecheck
    - build
    - test
