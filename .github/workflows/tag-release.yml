name: Tag Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write # gh release create
  actions: write # gh workflow run release.yml

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0 # git-cliff needs full history for changelog

      - name: Install git-cliff
        uses: taiki-e/install-action@b3833c305283683eafb8fd4b888e3ea0ddac2042 # git-cliff

      - name: Generate changelog
        run: git-cliff --latest --strip header -o CHANGELOG_RELEASE.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # 前置き付きのタグ（v0.1.0-alpha.1 など）は prerelease として作り、
        # Latest の印を付けない。
        run: |
          prerelease=()
          case "${{ github.ref_name }}" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file CHANGELOG_RELEASE.md \
            "${prerelease[@]}"

      # GITHUB_TOKEN で作った Release では release イベントの workflow が起きない。
      # workflow_dispatch はその例外なので、release.yml をタグの ref で起こす。
      - name: Dispatch publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref "${{ github.ref_name }}"
