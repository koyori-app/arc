name: Release

# 初版は手動 publish 後、npmjs.com でこのリポジトリ + workflow を
# Trusted Publisher として登録すること。以降は GitHub Release 公開で自動 publish。
#
# tag-release.yml が作る Release は GITHUB_TOKEN 由来なので、release イベントで
# この workflow は起きない。そのため tag-release.yml は Release を作った後に
# workflow_dispatch でこの workflow をタグの ref で起こす。人が画面から
# Release を公開した時は、release イベントで起きる。
on:
  release:
    types: [published]
  workflow_dispatch:

# 同じタグで二度走っても、片方が終わるまでもう片方を待たせる。
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # 系譜の検証（master の祖先か）に全履歴が要る。浅い clone では
          # merge-base が共通祖先を見つけられず、正しいタグまで拒みうる。
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@205232b9cc28eb4b4b460460835d993f6fc018e1 # wasm-pack

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # 取り消せぬレジストリへ流す前の門。release イベントは任意の ref から
      # 作れるため、(1) タグ名と cargo metadata の版の一致、(2) 対象 SHA が
      # master の祖先であること、(3) trusted publishing (OIDC) が要求する
      # npm >= 11.5.1 を満たすこと——を検めてから publish に進む。
      # 速く落ちる順に並べる: 版の照合（網も履歴も要らぬ）→ 系譜 → npm。
      # タグと版と系譜の照合は scripts/verify-release.sh にある。手元でも同じ
      # script を撃って確かめられる。workflow_dispatch は枝の ref でも起こせる
      # ため、ref がタグであることはここで確かめる。
      - name: Verify tag, lineage and npm before publishing
        id: verify
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::${GITHUB_REF} はタグではない。タグの ref で起こすこと"
            exit 1
          fi
          dist_tag=$(bash scripts/verify-release.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}")
          echo "dist_tag=${dist_tag}" >> "$GITHUB_OUTPUT"
          npm_ver=$(npm --version)
          if ! printf '11.5.1\n%s\n' "$npm_ver" | sort -V -C; then
            echo "::error::npm ${npm_ver} は trusted publishing の要件 (>= 11.5.1) を満たさない"
            exit 1
          fi

      # trusted publishing (OIDC) は npm >= 11.5.1 を要する。かつては
      # `npm install -g npm@latest` で上げていたが、latest は可変参照であり
      # 取り消せぬ publish の直前に検証なしの道具を引き込む。Node 24 の同梱
      # npm は 11.19.0 (2026-09-24 実測・nodejs.org の dist index) で要件を
      # 満たすため、グローバルインストール自体を消した。要件は上の検証が
      # 門として確かめる——同梱 npm が要件を割れば publish の前に止まる。

      - name: Build npm package
        run: bash scripts/build-npm.sh

      # No NODE_AUTH_TOKEN needed — OIDC id-token is exchanged automatically.
      - name: Publish to npm
        working-directory: crates/koyori-arc-core/pkg
        # 前置き付きの版は latest を動かさず、前置きの dist-tag（alpha など）で出す。
        run: npm publish --provenance --access public --tag "${{ steps.verify.outputs.dist_tag }}"

      # crates.io Trusted Publisher (OIDC) — no stored token needed.
      # Register this repo + workflow on crates.io before the first publish.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p koyori-arc-core

      # 正式版を出すまでは、前置き付きの版を出すたびに npm の latest もその版へ動かす。
      # 正式版が latest になったら自ら止まる。判断は scripts/npm-latest-follow.sh が
      # registry の latest を見て決める（手元でも --apply 無しで同じ判断を撃てる）。
      # 二つの publish の後に置くので、どちらかが落ちればこの段は走らず、latest は動かない。
      # npm dist-tag の OIDC 認証は npm 12.2.0 から入った。Node 24 同梱の npm 11.19.0 では
      # 認証できないので、この段でだけ版を固定した npm を入れる（publish は済んでいる）。
      - name: Let npm latest follow pre-releases until the first stable release
        run: |
          npm install -g npm@12.2.1
          bash scripts/npm-latest-follow.sh --apply @koyori-app/arc "${GITHUB_REF_NAME#v}"
