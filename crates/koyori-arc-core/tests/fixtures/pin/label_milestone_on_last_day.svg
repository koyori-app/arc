<svg xmlns="http://www.w3.org/2000/svg" width="764.435" height="160" viewBox="0 0 764.435 160" role="img" aria-label="Gantt chart" font-family="sans-serif" font-size="12"><title>Gantt chart</title><desc>Task schedule with progress bars and dependency arrows</desc><rect x="120" y="0" width="644.435" height="30" fill="#f3f4f6"/><line x1="120" y1="30" x2="120" y2="160" stroke="#e5e7eb" stroke-width="1"/><text x="120" y="19" fill="#6b7280" font-size="11">6/1</text><line x1="330" y1="30" x2="330" y2="160" stroke="#e5e7eb" stroke-width="1"/><text x="330" y="19" fill="#6b7280" font-size="11">6/8</text><line x1="540" y1="30" x2="540" y2="160" stroke="#e5e7eb" stroke-width="1"/><text x="540" y="19" fill="#6b7280" font-size="11">6/15</text><g data-task-id="a"><title>A: 2026-06-01 – 2026-06-21 (40%)</title><rect class="bar-bg" x="120" y="40" width="600" height="20" rx="4" fill="#d1d5db"/><rect class="bar-progress bar-tier-mid" x="120" y="40" width="240" height="20" rx="4" fill="#6366f1"/><text x="420" y="50" text-anchor="middle" fill="#374151" font-size="11" font-weight="600" dominant-baseline="middle">40%</text><text x="116" y="50" text-anchor="end" dominant-baseline="middle">A</text></g><g data-task-id="m"><title>M: 2026-06-21 – 2026-06-21 (100%)</title><polygon class="bar-milestone bar-tier-done" points="720,80 730,90 720,100 710,90" fill="#22c55e" stroke="#d1d5db" stroke-width="1"/><text x="736" y="90" fill="#374151" font-size="11" font-weight="600" dominant-baseline="middle">100%</text><text x="116" y="90" text-anchor="end" dominant-baseline="middle">M</text></g><polyline class="progress-status-line" points="360,50 720,90" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,3"/><g class="progress-line-legend" aria-hidden="true"><line x1="128" y1="134" x2="156" y2="134" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,3"/><text x="162" y="138" fill="#6b7280" font-size="10" dominant-baseline="middle">進捗ステータスライン（各タスクの完了位置を結ぶ）</text></g><g class="bar-tier-l