<svg xmlns="http://www.w3.org/2000/svg" width="422" height="160" viewBox="0 0 422 160" role="img" aria-label="Gantt chart" font-family="sans-serif" font-size="12"><title>Gantt chart</title><desc>Task schedule with progress bars and dependency arrows</desc><rect x="120" y="0" width="302" height="30" fill="#f3f4f6"/><line x1="120" y1="30" x2="120" y2="160" stroke="#e5e7eb" stroke-width="1"/><text x="120" y="19" fill="#6b7280" font-size="11">6/1</text><g data-task-id="a"><title>open: 2026-06-01 – 2026-06-02 (20%)</title><rect class="bar-bg" x="120" y="40" width="30" height="20" rx="4" fill="#d1d5db"/><rect class="bar-progress bar-tier-low" x="120" y="40" width="6" height="20" rx="4" fill="#f59e0b"/><text x="135" y="50" text-anchor="middle" fill="#374151" font-size="11" font-weight="600" dominant-baseline="middle">20%</text><text x="116" y="50" text-anchor="end" dominant-baseline="middle">open</text></g><g data-task-id="b"><title>open2: 2026-06-03 – 2026-06-04 (60%)</title><rect class="bar-bg" x="180" y="80" width="30" height="20" rx="4" fill="#d1d5db"/><rect class="bar-progress bar-tier-mid" x="180" y="80" width="18" height="20" rx="4" fill="#6366f1"/><text x="195" y="90" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600" dominant-baseline="middle">60%</text><text x="116" y="90" text-anchor="end" dominant-baseline="middle">open2</text></g><line x1="150" y1="0" x2="150" y2="160" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3"/><polyline class="progress-status-line" points="150,30 126,50 198,90 150,110" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,3"/><g class="progress-line-legend" aria-hidden="true"><line x1="128" y1="134" x2="156" y2="134" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,3"/><text x="162" y="138" fill="#6b7280" font-size="10" dominant-baseline="middle">進捗ステータスライン（各タスクの完了位置を結ぶ）</text></g><g class="bar-tier-legend" aria-hidden="true"><rect x="128" y="145" width="10" height="10" rx="2" fill="#d1d5db"/>